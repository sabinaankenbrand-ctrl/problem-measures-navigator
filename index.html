<!doctype html>
<!-- ============================================================
     PROBLEM–MEASURE NAVIGATOR
     DANUBE4all · DSQ2 · WP7
     ------------------------------------------------------------
     Page layout:  problems (left) | measure tree (middle) | measures (right)
     All content comes from data.js (same folder).
     Libraries:    d3 v7 (draws the tree), Google Fonts
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Problem–Measure Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* --- COLOURS, FONTS AND SIZES --- */
:root {
  --bg: #F5F8FB;  --panel: #FFFFFF;  --soft: #EEF3F8;  --line: #DCE6F1;
  --ink: #102F5E; --ink-2: #52657A;  --ink-3: #8A9AAD;
  --tile: #FFFFFF; --tile-ring: rgba(16,47,94,.14);
  --hub: #102F5E;  --hub-ink: #FFFFFF;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --panel-height: clamp(560px, calc(100vh - 200px), 940px);   /* all three panels share this height */
}
/* dark mode: only the colours change */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0C1626;  --panel: #122036;  --soft: #1A2B45;  --line: #22344F;
    --ink: #E6EEF8; --ink-2: #A7B6C9;  --ink-3: #6E819A;
    --tile-ring: rgba(255,255,255,.2); --hub: #E6EEF8; --hub-ink: #0C1626;
    color-scheme: dark;
  }
}

/* --- PAGE --- */
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); margin: 0; }
body {
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding: 22px max(16px, env(safe-area-inset-right, 0px)) 36px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 1640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid #2F80ED; outline-offset: 2px; }

/* --- HEADER: title, project switch, hide button --- */
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 3vw, 36px); line-height: 1.05; margin: 4px 0 0; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; }
.seg .lab { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); padding: 5px 4px 5px 8px; }
.seg button { font-size: 13.5px; border: 0; background: none; color: var(--ink-2); padding: 5px 14px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.btn { font-size: 13px; border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 9px; cursor: pointer; }

/* --- SELECTION BAR (what is currently selected) --- */
.selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 40px; padding: 7px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; font-size: 14px; }
.selbar .btn { margin-left: auto; padding: 4px 12px; }
.pill { font-family: var(--f-mono); font-size: 12px; padding: 2px 9px; border-radius: 999px; color: #fff; white-space: nowrap; }
.hint { color: var(--ink-2); }

/* --- THREE PANELS --- */
.panels { display: grid; grid-template-columns: 290px minmax(0, 1fr) 330px; gap: 14px; height: var(--panel-height); }
.panels > * { height: var(--panel-height); min-width: 0; }
.panels.no-problems { grid-template-columns: minmax(0, 1fr) 340px; }
.panels.no-problems > #problems { display: none; }
@media (max-width: 1180px) { .panels { grid-template-columns: 250px minmax(0, 1fr) 290px; } }
@media (max-width: 900px)  { .panels, .panels.no-problems { grid-template-columns: minmax(0, 1fr); height: auto; } .panels > * { height: 560px; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: auto; position: relative; }

/* --- LEFT PANEL: problems --- */
.ph { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.ph h2 { margin: 0; font-family: var(--f-display); font-size: 18px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
.ph h2 small { font-family: var(--f-body); font-size: 13px; font-weight: 400; color: var(--ink-2); }
.ph .hint { font-size: 12.5px; margin-top: 2px; }
.pb { padding: 4px 10px 14px; }
.pcat { margin-top: 6px; }
.pcat h3 { margin: 0 0 2px; }
.pcat-head {   /* problem category header, clickable */
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; cursor: pointer; text-align: left;
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent);
}
.pcat-head:hover { background: color-mix(in srgb, var(--c) 18%, transparent); }
.pcat-head .cnt { margin-left: auto; color: var(--ink-2); }
.pcat-head.on { background: var(--c); color: #fff; }
.pcat-head.on .cnt { color: rgba(255,255,255,.85); }
.prob {        /* one problem row: ID · name · number of linked measures */
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; width: 100%;
  border: 0; background: none; padding: 4px 6px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 13.5px; line-height: 1.3;
}
.prob:hover { background: color-mix(in srgb, var(--c) 12%, transparent); }
.prob .id { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-2); min-width: 54px; }
.prob .n  { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.prob.on  { background: var(--c); color: #fff; }
.prob.on .id, .prob.on .n { color: rgba(255,255,255,.85); }
.prob.hit { box-shadow: inset 3px 0 0 var(--c); background: color-mix(in srgb, var(--c) 9%, transparent); }
.prob.zero { opacity: .4; }

/* --- MIDDLE PANEL: measure tree --- */
.stage { overflow: hidden; display: flex; }
.stage svg { width: 100%; height: 100%; display: block; }
svg text { font-family: var(--f-body); }
.lbl  { fill: var(--ink); }
.lid  { font-family: var(--f-mono); fill: var(--ink-3); }
.fade { transition: opacity .2s; }
.dim  { opacity: .1; }
.badge text { font-family: var(--f-mono); font-weight: 500; fill: #fff; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 13px; padding: 7px 10px;
  border-radius: 8px; max-width: 300px; opacity: 0; transition: opacity .12s; z-index: 10; }
.tip .id { font-family: var(--f-mono); font-size: 11px; opacity: .75; }

/* --- RIGHT PANEL: measures --- */
.dt { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13px; color: var(--ink-2); }
.crumbs .sep { color: var(--ink-3); }
.crumb { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.dhead { display: flex; gap: 14px; align-items: center; }
.dhead h2 { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.15; margin: 2px 0 0; text-wrap: balance; }
.big { width: 64px; height: 64px; flex: none; background: var(--tile); border-radius: 14px; }
.sm  { width: 34px; height: 34px; flex: none; background: var(--tile); border-radius: 8px; }
.big.round, .sm.round { border-radius: 50%; }
.noico { display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; color: var(--c); box-shadow: inset 0 0 0 1.5px var(--c); }
.big.noico { font-size: 20px; }
.dlist, .dgrp { display: flex; flex-direction: column; gap: 2px; }
.drow, .dgh {  /* category / group row */
  display: flex; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 10px; cursor: pointer;
  background: none; border: 0; text-align: left; width: 100%;
}
.drow:hover, .dgh:hover { background: color-mix(in srgb, var(--c) 12%, transparent); }
.drow .t, .dgh .t { flex: 1; min-width: 0; font-size: 14px; line-height: 1.3; }
.dgh .t { font-weight: 600; font-size: 13.5px; }
.drow .n, .dgh .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--c); }
.mrow {        /* one measure row: ID · name */
  display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer;
  background: none; border: 0; text-align: left; width: 100%; font-size: 14px; line-height: 1.3;
}
.mrow:hover, .mrow.on { background: color-mix(in srgb, var(--c) 14%, transparent); }
.mid { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); padding-top: 1px; }

/* --- FOOTNOTE --- */
.note { font-size: 12.5px; color: var(--ink-2); margin: 0; }

@media (prefers-reduced-motion: reduce) { .fade, .tip { transition: none; } }
</style>
</head>

<body>
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div>
      <div class="eyebrow">DANUBE4all · DSQ2 · WP7</div>
      <h1>Problem–Measure Navigator</h1>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Project">
        <span class="lab">Project</span>
        <button data-project="D4A" aria-pressed="true">D4A</button>
        <button data-project="DSQ2" aria-pressed="false">DSQ2</button>
      </div>
      <button class="btn" id="toggle-problems" aria-pressed="false">Hide problem list</button>
    </div>
  </header>

  <!-- SELECTION BAR -->
  <div class="selbar" id="selbar"></div>

  <!-- PANELS -->
  <section class="panels" id="panels">
    <div class="card" id="problems"></div>       <!-- left: problems -->
    <div class="card stage" id="tree"></div>      <!-- middle: measure tree -->
    <div class="card" id="measures"></div>       <!-- right: measures -->
  </section>

  <p class="note" id="note"></p>
</div>
<div class="tip" id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="data.js"></script>
<script>
(function () {

/* =================================================================
   1. DATA PREPARATION
   Turns the tables from data.js into lookups the page can use.
   ================================================================= */

const PCOLOR = Object.fromEntries(PROBLEM_CATEGORIES.map(c => [c.name, c.color]));   // problem category → colour
const PCATS = PROBLEM_CATEGORIES.map(c => c.name);                                    // order in the list
const problemById = Object.fromEntries(PROBLEMS.map(p => [p.id, p]));
const measureById = Object.fromEntries(MEASURES.map(m => [m.id, m]));
const groupById = Object.fromEntries(GROUPS.map(g => [g.id, g]));
const groupIcon = id => ICONS["G" + String(id).padStart(2, "0")] || null;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const plural = (k, word) => `${k} ${word}${k === 1 ? "" : "s"}`;

/* --- STATE --- */
let project = "D4A";       // "D4A" or "DSQ2"
let sel = null;            // current selection: {type: "problem" | "pcat" | "upper" | "group" | "measure", id}
let root, nodeByKey;       // measure tree for the current project (d3 hierarchy)
let linksOf = {};          // problem id → measures linked in the current project
let problemsOfMeasure = {};// measure id → problems linked in the current project

const inProject = id => measureById[id].projects.includes(project);

/* Builds the tree category → group → measure, with only the measures of the current project.
   Groups and categories without measures are left out. */
function buildTree() {
  const categories = CATEGORIES.map(c => ({
    id: c.id, name: c.name, color: c.color, icon: ICONS[c.id], kind: "upper",
    children: c.groups.map(gid => ({
      id: gid, name: groupById[gid].name, color: c.color, icon: groupIcon(gid), kind: "group",
      children: MEASURES.filter(m => m.group === gid && inProject(m.id))
                        .map(m => ({ id: m.id, name: m.name, color: c.color, kind: "measure" }))
    })).filter(g => g.children.length)
  })).filter(c => c.children.length);
  root = d3.hierarchy({ kind: "root", children: categories });
  nodeByKey = {};
  root.each(n => { if (n.depth) nodeByKey[n.data.kind + ":" + n.data.id] = n; });
}

/* Matrix links, reduced to the measures of the current project. */
function buildLinks() {
  linksOf = {}; problemsOfMeasure = {};
  PROBLEMS.forEach(p => {
    linksOf[p.id] = p.measures.filter(inProject);
    linksOf[p.id].forEach(m => (problemsOfMeasure[m] = problemsOfMeasure[m] || []).push(p.id));
  });
}

/* =================================================================
   2. SELECTION LOGIC
   ================================================================= */

const findNode = s => s && nodeByKey[s.type + ":" + s.id];
const isProblemSide = s => s && (s.type === "problem" || s.type === "pcat");

/* Measures that belong to the selection */
function measuresOf(s) {
  if (!s) return null;
  if (s.type === "problem") return new Set(linksOf[s.id]);
  if (s.type === "pcat") {
    const set = new Set();
    PROBLEMS.filter(p => p.category === s.id).forEach(p => linksOf[p.id].forEach(m => set.add(m)));
    return set;
  }
  return new Set(findNode(s).leaves().map(l => l.data.id));
}

/* Problems that belong to the selection */
function problemsOf(s) {
  if (!s) return null;
  if (s.type === "problem") return new Set([s.id]);
  if (s.type === "pcat") return new Set(PROBLEMS.filter(p => p.category === s.id).map(p => p.id));
  const set = new Set();
  measuresOf(s).forEach(m => (problemsOfMeasure[m] || []).forEach(p => set.add(p)));
  return set;
}

/* Is a tree node part of the current selection? (otherwise it is greyed out) */
function isActive(n) {
  const ms = measuresOf(sel);
  if (!ms) return true;
  if (isProblemSide(sel)) return n.depth === 0 || n.leaves().some(l => ms.has(l.data.id));
  const t = findNode(sel);
  return n.depth === 0 || t.ancestors().includes(n) || t.descendants().includes(n);
}

/* Short label for a selection, e.g. "Group 6" or "D4A_045" */
function label(s) {
  if (isProblemSide(s)) return s.id;
  const n = findNode(s);
  return n.data.kind === "measure" ? n.data.id : (n.data.kind === "group" ? "Group " : "Category ") + n.data.id;
}

/* Every panel registers a render function; all of them run after each change. */
const views = [];
const render = () => views.forEach(v => v());
const same = (a, b) => a && b && a.type === b.type && String(a.id) === String(b.id);
function select(s) { sel = s; render(); }
function toggle(s) { select(same(sel, s) ? null : s); }

function setProject(p) {
  project = p;
  buildTree(); buildLinks();
  document.querySelectorAll("[data-project]").forEach(b => b.setAttribute("aria-pressed", b.dataset.project === p));
  if (sel && !isProblemSide(sel) && !findNode(sel)) sel = null;   // selection no longer exists in this project
  render();
}

/* --- TOOLTIP --- */
const tip = document.getElementById("tip");
function showTip(ev, html) {
  tip.innerHTML = html;
  let x = ev.clientX + 14;
  if (x > innerWidth - 320) x -= 330;
  tip.style.left = x + "px"; tip.style.top = ev.clientY + 14 + "px"; tip.style.opacity = 1;
}
const hideTip = () => { tip.style.opacity = 0; };
function nodeTip(n) {
  const d = n.data;
  if (d.kind === "measure") return `<div class="id">${d.id} · ${plural((problemsOfMeasure[d.id] || []).length, "problem")}</div>${esc(d.name)}`;
  return `<div class="id">${d.kind === "group" ? "Group" : "Category"} ${d.id} · ${plural(n.leaves().length, "measure")}</div>${esc(d.name)}`;
}

/* Scrolls a panel so that an element is visible below the sticky panel header */
function scrollWithin(box, el) {
  const a = el.getBoundingClientRect(), b = box.getBoundingClientRect(), ph = box.querySelector(".ph");
  box.scrollTo({ top: box.scrollTop + a.top - b.top - (ph ? ph.offsetHeight : 0) - 8 });
}

/* =================================================================
   3. LEFT PANEL: PROBLEMS
   Problem categories are clickable. When a measure, group or category
   is selected, only the linked problems are shown.
   ================================================================= */
function problemsPanel(el) {
  el.innerHTML = `<div class="ph"><h2>Problems <small>by problem category</small></h2><div class="hint" data-hint></div></div><div class="pb" data-body></div>`;
  const body = el.querySelector("[data-body]"), hint = el.querySelector("[data-hint]");

  body.innerHTML = PCATS.map(c => `
    <div class="pcat" data-cat="${c}" style="--c:${PCOLOR[c]}">
      <h3><button class="pcat-head" data-pcat="${c}">${c}<span class="cnt" data-cnt></span></button></h3>
      ${PROBLEMS.filter(p => p.category === c).map(p => `
        <button class="prob" data-problem="${p.id}" style="--c:${PCOLOR[c]}">
          <span class="id">${p.id}</span><span>${esc(p.name)}</span><span class="n" data-n></span>
        </button>`).join("")}
    </div>`).join("");

  body.querySelectorAll(".prob").forEach(b => b.onclick = () => toggle({ type: "problem", id: b.dataset.problem }));
  body.querySelectorAll(".pcat-head").forEach(b => b.onclick = () => toggle({ type: "pcat", id: b.dataset.pcat }));

  views.push(() => {
    const filtered = sel && !isProblemSide(sel);
    const shown = filtered ? problemsOf(sel) : null;

    body.querySelectorAll(".prob").forEach(b => {
      const id = b.dataset.problem, k = linksOf[id].length;
      b.querySelector("[data-n]").textContent = k;
      b.classList.toggle("zero", k === 0);
      b.hidden = !!shown && !shown.has(id);
      b.classList.toggle("on", !!sel && sel.type === "problem" && sel.id === id);
      b.classList.toggle("hit", !!sel && sel.type === "pcat" && problemById[id].category === sel.id);
    });
    body.querySelectorAll(".pcat").forEach(c => {
      const all = PROBLEMS.filter(p => p.category === c.dataset.cat);
      const k = shown ? all.filter(p => shown.has(p.id)).length : all.length;
      c.hidden = k === 0;
      c.querySelector("[data-cnt]").textContent = shown ? `${k} of ${all.length}` : all.length;
      c.querySelector(".pcat-head").classList.toggle("on", !!sel && sel.type === "pcat" && sel.id === c.dataset.cat);
    });

    if (filtered) { hint.innerHTML = `Showing only the <b>${shown.size}</b> problems linked to ${label(sel).replace(/^Group|^Category/, w => w.toLowerCase())}.`; el.scrollTop = 0; }
    else if (sel && sel.type === "pcat") hint.textContent = "Click a single problem to narrow it down.";
    else hint.textContent = sel ? "Click another problem, or a category header." : `${PROBLEMS.length} problems. Pick a problem or a whole category.`;

    const active = body.querySelector(".prob.on, .pcat-head.on");
    if (active) {
      const a = active.getBoundingClientRect(), r = el.getBoundingClientRect();
      if (a.top < r.top + 80 || a.bottom > r.bottom) scrollWithin(el, active);
    }
  });
}

/* =================================================================
   4. MIDDLE PANEL: MEASURE TREE (radial)
   centre → categories A–F → groups → measures.
   The tree is redrawn when the project changes; a selection only
   changes which parts are greyed out.
   ================================================================= */
function treePanel(el) {
  /* sizes in SVG units (the SVG scales to the panel) */
  const SIZE = 1330, HUB = 112;                        // drawing size, radius of the centre circle
  const R_CAT = 172, R_GROUP = 286, R_MEASURE = 382;   // ring radii
  const ICON_CAT = 52, ICON_GROUP = 42;                // icon sizes
  const GAP_GROUP = 3.8, GAP_CAT = 6.5;                // extra space between groups / categories

  let drawnFor = null, pos, icons, dots, labels, wedges, links, badges, hubCircle, hubText;

  function draw() {
    el.innerHTML = "";
    d3.cluster().size([2 * Math.PI, 1])
      .separation((a, b) => a.parent === b.parent ? 1 : (a.parent.parent === b.parent.parent ? GAP_GROUP : GAP_CAT))(root);
    const radius = { 0: 0, 1: R_CAT, 2: R_GROUP, 3: R_MEASURE };
    root.each(n => n.r = radius[n.depth]);
    pos = n => [n.r * Math.sin(n.x), -n.r * Math.cos(n.x)];

    const svg = d3.select(el).append("svg").attr("viewBox", [-SIZE / 2, -SIZE / 2, SIZE, SIZE])
      .attr("role", "img").attr("aria-label", "Radial tree of measures");
    const gWedge = svg.append("g"), gLink = svg.append("g").attr("fill", "none"),
          gNode = svg.append("g"), gText = svg.append("g");
    badges = svg.append("g");

    /* --- background wedges and outer ring per category / group --- */
    const nCat = root.children.length, nGroup = root.descendants().filter(n => n.depth === 2).length;
    const half = Math.PI / (root.leaves().length + (nGroup - nCat) * (GAP_GROUP - 1) + nCat * (GAP_CAT - 1)) * 1.1;
    const arc = d3.arc(), parts = [];
    root.children.forEach(c => {
      const lv = c.leaves(), a0 = lv[0].x - half, a1 = lv[lv.length - 1].x + half;
      parts.push(gWedge.append("path").datum(c).attr("class", "fade").attr("fill", c.data.color).attr("fill-opacity", .07)
        .attr("d", arc({ innerRadius: HUB + 6, outerRadius: R_MEASURE + 6, startAngle: a0, endAngle: a1 })).node());
      parts.push(gWedge.append("path").datum(c).attr("class", "fade").attr("fill", c.data.color)
        .attr("d", arc({ innerRadius: R_MEASURE - 20, outerRadius: R_MEASURE - 13, startAngle: a0, endAngle: a1, cornerRadius: 3 })).node());
      c.children.forEach(g => {
        const gl = g.leaves();
        parts.push(gWedge.append("path").datum(g).attr("class", "fade").attr("fill", c.data.color).attr("fill-opacity", .1)
          .attr("d", arc({ innerRadius: R_GROUP + 26, outerRadius: R_MEASURE - 28, startAngle: gl[0].x - half * .8, endAngle: gl[gl.length - 1].x + half * .8, cornerRadius: 6 })).node());
      });
    });
    wedges = d3.selectAll(parts);

    /* --- connecting lines --- */
    const link = d3.linkRadial().angle(d => d.x).radius(d => d.r);
    links = gLink.selectAll("path").data(root.links()).join("path").attr("class", "fade")
      .attr("d", l => link({ source: { x: l.source.x, r: l.source.depth ? l.source.r : HUB },
                             target: { x: l.target.x, r: l.target.depth === 3 ? R_MEASURE - 28 : l.target.r } }))
      .attr("stroke", l => l.target.data.color)
      .attr("stroke-opacity", l => l.target.depth === 3 ? .45 : .75)
      .attr("stroke-width", l => [0, 3.2, 2, 1.1][l.target.depth]);

    /* --- centre circle (click = clear selection) --- */
    const hub = gNode.append("g").style("cursor", "pointer").on("click", () => select(null));
    hubCircle = hub.append("circle").attr("r", HUB);
    hubText = hub.append("text").attr("text-anchor", "middle");

    /* --- category and group icons --- */
    icons = gNode.selectAll("g.icon").data(root.descendants().filter(n => n.depth === 1 || n.depth === 2)).join("g")
      .attr("class", "icon fade").attr("transform", n => `translate(${pos(n)})`).style("cursor", "pointer");
    icons.each(function (n) {
      const s = n.depth === 1 ? ICON_CAT : ICON_GROUP, g = d3.select(this);
      if (n.depth === 1) g.append("circle").attr("r", s / 2 + 5).attr("fill", "var(--tile)").attr("stroke", n.data.color).attr("stroke-width", 2.5);
      else g.append("rect").attr("x", -s / 2 - 3).attr("y", -s / 2 - 3).attr("width", s + 6).attr("height", s + 6).attr("rx", 8)
             .attr("fill", "var(--tile)").attr("stroke", n.data.icon ? "var(--tile-ring)" : n.data.color).attr("stroke-width", n.data.icon ? 1 : 1.5);
      if (n.data.icon) g.append("image").attr("href", n.data.icon).attr("x", -s / 2).attr("y", -s / 2).attr("width", s).attr("height", s);
      else g.append("text").attr("text-anchor", "middle").attr("dy", "0.35em").attr("fill", n.data.color)    // no icon yet: show the number
             .style("font-family", "var(--f-mono)").style("font-size", "14px").text(n.data.id);
      if (n.depth === 1) g.append("text").attr("y", -s / 2 - 12).attr("text-anchor", "middle").attr("fill", n.data.color)
             .style("font-family", "var(--f-display)").style("font-weight", 700).style("font-size", "15px").text(n.data.id);
    });

    /* --- measure dots and labels (ID + name, long names shortened; full name in the tooltip) --- */
    const leaves = root.leaves();
    dots = gNode.selectAll("circle.dot").data(leaves).join("circle").attr("class", "dot fade")
      .attr("cx", n => pos(n)[0]).attr("cy", n => pos(n)[1]).attr("r", 4.2)
      .attr("fill", n => n.data.color).attr("stroke", "var(--panel)").attr("stroke-width", 1.5).style("cursor", "pointer");
    labels = gText.selectAll("text").data(leaves).join("text").attr("class", "lbl fade").style("cursor", "pointer")
      .attr("dy", "0.33em").style("font-size", "12.5px")
      .attr("transform", n => `rotate(${n.x * 180 / Math.PI - 90}) translate(${R_MEASURE + 10},0) ${n.x >= Math.PI ? "rotate(180)" : ""}`)
      .attr("text-anchor", n => n.x >= Math.PI ? "end" : "start");
    labels.each(function (n) {
      const t = d3.select(this), name = n.data.name.length > 32 ? n.data.name.slice(0, 30).trimEnd() + "…" : n.data.name;
      const id = s => t.append("tspan").attr("class", "lid").style("font-size", "11px").text(s);
      if (n.x >= Math.PI) { t.append("tspan").text(name + "  "); id(n.data.id); }   // left half: name first
      else { id(n.data.id + "  "); t.append("tspan").text(name); }                  // right half: ID first
    });

    [icons, dots, labels].forEach(s => s
      .on("mousemove", (ev, n) => showTip(ev, nodeTip(n)))
      .on("mouseleave", hideTip)
      .on("click", (ev, n) => toggle({ type: n.data.kind, id: n.data.id })));
  }

  /* text in the centre circle, one entry per line */
  function setHubText(lines) {
    hubText.selectAll("*").remove();
    const lh = 22, y0 = -(lines.length - 1) * lh / 2;
    lines.forEach((l, i) => hubText.append("tspan").attr("x", 0).attr("y", y0 + i * lh + 6)
      .attr("fill", l.color || "#fff").style("font-size", l.size + "px").style("font-weight", l.weight || 400)
      .style("font-family", l.font || "var(--f-body)").text(l.text));
  }
  function wrap(s, n) {   // splits a name into lines of about n characters (max. 4 lines)
    const out = []; let line = "";
    s.split(" ").forEach(w => { if ((line + " " + w).trim().length > n) { out.push(line); line = w; } else line = (line + " " + w).trim(); });
    out.push(line);
    return out.length > 4 ? [...out.slice(0, 3), out[3] + "…"] : out;
  }
  const title = s => wrap(s, 14).map(text => ({ text, size: 19, weight: 600 }));
  const small = (text, mono) => ({ text, size: 14, font: mono ? "var(--f-mono)" : undefined });

  views.push(() => {
    if (drawnFor !== project) { draw(); drawnFor = project; }
    const ms = measuresOf(sel);

    /* grey out everything that is not part of the selection */
    [icons, dots, labels].forEach(s => s.classed("dim", n => !isActive(n)));
    wedges.classed("dim", n => !isActive(n));
    links.classed("dim", l => !(isActive(l.target) && isActive(l.source)));

    /* number badges on the groups when a problem (category) is selected */
    badges.selectAll("*").remove();
    if (isProblemSide(sel)) icons.filter(n => n.depth === 2 && isActive(n)).each(n => {
      const k = n.leaves().filter(l => ms.has(l.data.id)).length, [x, y] = pos(n);
      const b = badges.append("g").attr("class", "badge").attr("transform", `translate(${x + ICON_GROUP / 2 + 3},${y - ICON_GROUP / 2 - 3})`);
      b.append("circle").attr("r", 10).attr("fill", n.data.color).attr("stroke", "var(--panel)").attr("stroke-width", 2);
      b.append("text").attr("text-anchor", "middle").attr("dy", "0.35em").style("font-size", "11px").text(k);
    });

    /* centre circle */
    if (!sel) {
      hubCircle.attr("fill", "var(--hub)");
      setHubText([{ text: "D4A", size: 36, weight: 700, font: "var(--f-display)", color: "var(--hub-ink)" },
                  { text: "pick a problem", size: 15, color: "var(--hub-ink)" }, { text: "or a measure", size: 15, color: "var(--hub-ink)" }]);
    } else if (sel.type === "problem") {
      const p = problemById[sel.id];
      hubCircle.attr("fill", PCOLOR[p.category]);
      setHubText([small(p.id, true), ...title(p.name), small(plural(ms.size, "measure"))]);
    } else if (sel.type === "pcat") {
      hubCircle.attr("fill", PCOLOR[sel.id]);
      setHubText([small("Problem category", true), { text: sel.id, size: 24, weight: 600 },
                  small(plural(problemsOf(sel).size, "problem")), small(plural(ms.size, "measure"))]);
    } else {
      const n = findNode(sel);
      hubCircle.attr("fill", n.data.color);
      setHubText([small(label(sel), true), ...title(n.data.name), small(plural(problemsOf(sel).size, "problem"))]);
    }
  });
}

/* =================================================================
   5. RIGHT PANEL: MEASURES
   nothing selected → categories · category → its groups ·
   group / measure → its measures · problem → linked measures by group
   ================================================================= */
function measuresPanel(el) {
  const icon = (n, cls) => n.data.icon
    ? `<img class="${cls}" src="${n.data.icon}" alt="">`
    : `<span class="${cls} noico" style="--c:${n.data.color}">${n.data.id}</span>`;
  const head = (n, eyebrow, title) =>
    `<div class="dhead">${icon(n, n.depth === 1 ? "big round" : "big")}<div><div class="eyebrow" style="color:${n.data.color}">${eyebrow}</div><h2>${esc(title)}</h2></div></div>`;
  const categoryRow = (c, max) => {
    const k = c.leaves().length;
    return `<button class="drow" data-cat="${c.data.id}" style="--c:${c.data.color}">${icon(c, "sm round")}
      <span class="t"><b style="color:${c.data.color}">${c.data.id}</b> ${esc(c.data.name)}<span class="bar"><i style="width:${k / max * 100}%"></i></span></span>
      <span class="n">${k}</span></button>`;
  };
  const groupRow = g => `<button class="drow" data-group="${g.data.id}" style="--c:${g.data.color}">${icon(g, "sm")}
      <span class="t">${g.data.id}. ${esc(g.data.name)}</span><span class="n">${g.leaves().length}</span></button>`;
  const measureRow = (m, on) => `<button class="mrow${on ? " on" : ""}" data-measure="${m.data.id}" style="--c:${m.data.color}">
      <span class="mid">${m.data.id}</span><span>${esc(m.data.name)}</span></button>`;

  /* breadcrumbs: All categories / Category X / Group n */
  function crumbs() {
    if (!sel) return "";
    const parts = [`<button class="crumb" data-all>All categories</button>`];
    if (!isProblemSide(sel)) findNode(sel).ancestors().reverse().slice(1, -1).forEach(x =>
      parts.push(`<button class="crumb" data-${x.depth === 1 ? "cat" : "group"}="${x.data.id}">${x.depth === 1 ? "Category" : "Group"} ${x.data.id}</button>`));
    return `<nav class="crumbs">${parts.join('<span class="sep">/</span>')}</nav>`;
  }

  views.push(() => {
    let html = "";
    if (!sel) {
      const max = d3.max(root.children, c => c.leaves().length);
      html = `<div class="dhead"><div><div class="eyebrow">Measures</div><h2>Measure categories</h2></div></div>
              <div class="dlist">${root.children.map(c => categoryRow(c, max)).join("")}</div>`;
    } else if (isProblemSide(sel)) {
      const ms = measuresOf(sel);
      const groups = root.descendants().filter(n => n.depth === 2 && n.leaves().some(l => ms.has(l.data.id)));
      const color = sel.type === "problem" ? PCOLOR[problemById[sel.id].category] : PCOLOR[sel.id];
      const eyebrow = sel.type === "problem" ? `${sel.id} · ${problemById[sel.id].category}` : "Problem category";
      const name = sel.type === "problem" ? problemById[sel.id].name : sel.id;
      html = `<div class="dhead"><div><div class="eyebrow" style="color:${color}">${eyebrow}</div><h2>${esc(name)}</h2></div></div>` +
        groups.map(g => {
          const linked = g.leaves().filter(l => ms.has(l.data.id));
          return `<div class="dgrp">
            <button class="dgh" data-group="${g.data.id}" style="--c:${g.data.color}">${icon(g, "sm")}
              <span class="t">${g.data.id}. ${esc(g.data.name)}</span><span class="n">${linked.length} of ${g.leaves().length}</span></button>
            ${linked.map(m => measureRow(m, false)).join("")}</div>`;
        }).join("");
    } else {
      const n = findNode(sel);
      if (n.depth === 1) html = head(n, "Category " + n.data.id, n.data.name) + `<div class="dlist">${n.children.map(groupRow).join("")}</div>`;
      else {
        const g = n.depth === 3 ? n.parent : n;
        html = head(g, `Group ${g.data.id} · Category ${g.parent.data.id}`, g.data.name) +
               `<div class="dlist">${g.leaves().map(m => measureRow(m, m === n)).join("")}</div>`;
      }
    }
    el.innerHTML = `<div class="dt">${crumbs()}${html}</div>`;
    el.scrollTop = 0;
    el.querySelectorAll("[data-all]").forEach(b => b.onclick = () => select(null));
    el.querySelectorAll("[data-measure]").forEach(b => b.onclick = () => toggle({ type: "measure", id: b.dataset.measure }));
    el.querySelectorAll("[data-group]").forEach(b => b.onclick = () => toggle({ type: "group", id: +b.dataset.group }));
    el.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => select({ type: "upper", id: b.dataset.cat }));
  });
}

/* =================================================================
   6. SELECTION BAR AND FOOTNOTE
   ================================================================= */
function selectionBar(bar, note) {
  views.push(() => {
    note.textContent = project === "DSQ2"
      ? `DSQ2: ${root.leaves().length} of ${MEASURES.length} measures (D4A-only measures are left out).`
      : `D4A: ${root.leaves().length} of ${MEASURES.length} measures.`;
    if (!sel) { bar.innerHTML = `<span class="hint">Nothing selected. Pick a problem or problem category, or a measure category, group or measure.</span>`; return; }
    let pill, name, extra;
    if (sel.type === "problem") {
      const p = problemById[sel.id];
      pill = `<span class="pill" style="background:${PCOLOR[p.category]}">${p.id}</span>`; name = esc(p.name); extra = plural(linksOf[p.id].length, "measure");
    } else if (sel.type === "pcat") {
      pill = `<span class="pill" style="background:${PCOLOR[sel.id]}">Problem category</span>`; name = esc(sel.id);
      extra = `${plural(problemsOf(sel).size, "problem")} · ${plural(measuresOf(sel).size, "measure")}`;
    } else {
      const n = findNode(sel);
      pill = `<span class="pill" style="background:${n.data.color}">${label(sel)}</span>`; name = esc(n.data.name); extra = plural(problemsOf(sel).size, "problem");
    }
    bar.innerHTML = `${pill}<b>${name}</b><span class="hint">${extra}</span><button class="btn" id="clear">Clear</button>`;
    document.getElementById("clear").onclick = () => select(null);
  });
}

/* =================================================================
   7. START
   ================================================================= */
project = "D4A";
buildTree(); buildLinks();
problemsPanel(document.getElementById("problems"));
treePanel(document.getElementById("tree"));
measuresPanel(document.getElementById("measures"));
selectionBar(document.getElementById("selbar"), document.getElementById("note"));

/* project switch (remembered in the browser) */
document.querySelectorAll("[data-project]").forEach(b => b.onclick = () => {
  setProject(b.dataset.project);
  try { localStorage.setItem("pmn-project", b.dataset.project); } catch (e) {}
});

/* hide / show the problem list (remembered in the browser) */
const panels = document.getElementById("panels"), toggleBtn = document.getElementById("toggle-problems");
function setProblemsHidden(hide) {
  panels.classList.toggle("no-problems", hide);
  toggleBtn.textContent = hide ? "Show problem list" : "Hide problem list";
  toggleBtn.setAttribute("aria-pressed", hide);
  try { localStorage.setItem("pmn-hide-problems", hide ? "1" : "0"); } catch (e) {}
}
toggleBtn.onclick = () => setProblemsHidden(!panels.classList.contains("no-problems"));

let startHidden = false, startProject = "D4A";
try { startHidden = localStorage.getItem("pmn-hide-problems") === "1"; startProject = localStorage.getItem("pmn-project") || "D4A"; } catch (e) {}
setProblemsHidden(startHidden);
setProject(startProject === "DSQ2" ? "DSQ2" : "D4A");

})();
</script>
